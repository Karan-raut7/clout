<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clout</title>

<!-- SEO -->
<title>Clout - Connect Without Limits</title>

<meta name="description"
      content="Clout is a modern real-time messaging platform. Connect, communicate and collaborate.">

<!-- Open Graph -->
<meta property="og:title"
      content="Clout - Connect Without Limits">

<meta property="og:description"
      content="Connect, communicate and collaborate with Clout.">

<meta property="og:type" content="website">

<meta property="og:site_name" content="Clout">

<meta property="og:url"
      content="https://clout-eq64.onrender.com/">

<meta property="og:image"
      content="https://clout-eq64.onrender.com/static/og-image.png">

<meta property="og:image:width" content="1734">
<meta property="og:image:height" content="907">

<!-- Twitter -->
<meta name="twitter:card"
      content="summary_large_image">

<meta name="twitter:title"
      content="Clout - Connect Without Limits">

<meta name="twitter:description"
      content="Connect, communicate and collaborate with Clout.">

<meta name="twitter:image"
      content="https://clout-eq64.onrender.com/static/og-image.png">

<link rel="stylesheet" href="/static/style.css?v=2">


</head>

<body>
    
<div class="box">

    <h1>Clout</h1>

    <!-- Navigation -->
    <div class="chat-tabs">
        <button class="tab active" data-tab="private">
            Private Chats
        </button>

        <button class="tab" data-tab="groups">
            Groups
        </button>
    </div>

    <!-- PRIVATE CHAT SECTION -->
    <section id="private-section" class="tab-content active">

        <h2>Direct Messages</h2>

        <ul id="dmList"></ul>

        <h2>Start a conversation</h2>

        <ul id="userList"></ul>

    </section>


    <!-- GROUP SECTION -->
    <section id="groups-section" class="tab-content">

        <h2>Create a group</h2>

        <div class="create-group">
            <input
                id="roomName"
                type="text"
                placeholder="Enter group name..."
            >

            <button id="createRoomButton">
                Create
            </button>
        </div>

        <h2>Available Groups</h2>

        <ul id="roomList"></ul>

        <p id="errorMessage"></p>

    </section>


    <div class="logout-container">
        <button id="logout">Log out</button>
    </div>

</div>

<script type="module" src="/static/home.js?v=3"></script>


</body>

</html>
