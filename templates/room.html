
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clout Room</title>

    <link rel="stylesheet" href="/static/style.css?v=4">
</head>

<body>
    

    <div class="chat-container">

        <!-- Header -->
        <header class="chat-header">

            <div class="room-info">
                <button class="back-button" id="backButton">←</button>

                <div>
                    
                    <h1 id="room-name">{{room_name }}</h1>
                    <p>🟢 Room {{ room_id }}</p>
                    
                </div>
            </div>

            <button class="menu-button" id="menuButton">⋮</button>

        </header>
       


        <!-- Messages -->
        <main class="chat-messages">

            <ul id="messages">

                <!-- Messages will be inserted here by room.js -->

            </ul>

        </main>
        


        <!-- Message Input -->
        <footer class="chat-input-area">

            <input
                id="messageText"
                type="text"
                autocomplete="off"
                placeholder="Type a message..."
            >


            <button id="sendButton" type="button">
                ➤
            </button>

        </footer>

    </div>
     <div id="messageMenu" class="message-menu" style="display: none;">
    <button id="editMessage">✏ Edit</button>
    <button id="deleteMessage">🗑 Delete</button>
</div>

    <script src="/static/room.js?v=2"></script>

</body>

</html>
